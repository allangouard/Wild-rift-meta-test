name: Tests Wild Rift V15.9 calculations
on:
  push:
    branches:
      - v159-mechanics-calculation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wrdi-mechanics-calculator-v159.js
      - run: node --check wrdi-draft-engine-v15.js
      - run: node --check wrdi-galio-five-item-optimizer-v1429.js
      - run: node --test wrdi-mechanics-calculator-v159.test.js wrdi-official-kit-intelligence-v158.test.js wrdi-v158-heal-pressure.test.js wrdi-draft-engine-v15.test.js wrdi-galio-five-item-optimizer-v1429.test.js
