name: WR Draft Mini - APK de test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compiler APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Charger le prototype Android
        uses: actions/checkout@v4
        with:
          ref: android-wr-draft-mini
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Localiser les outils SDK Android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "Outils de ligne de commande absents, installation officielle..."
            curl -fL --retry 3 --connect-timeout 20 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/android-commandline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/android-commandline-tools.zip -d /tmp
            cp -R /tmp/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
            SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDK_MANAGER"
          echo "SDK_MANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --version
      - name: Installer Android 35
        shell: bash
        run: |
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK debug
        run: gradle -p android-mini --no-daemon assembleDebug
      - name: Rendre APK disponible
        uses: actions/upload-artifact@v4
        with:
          name: WR-Draft-Mini-APK
          path: android-mini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
