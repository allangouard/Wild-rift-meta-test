name: WR Draft Mini - APK de test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compiler APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Charger le prototype Android
        uses: actions/checkout@v4
        with:
          ref: android-wr-draft-mini
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK debug
        run: gradle -p android-mini --no-daemon assembleDebug
      - name: Rendre APK disponible
        uses: actions/upload-artifact@v4
        with:
          name: WR-Draft-Mini-APK
          path: android-mini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
