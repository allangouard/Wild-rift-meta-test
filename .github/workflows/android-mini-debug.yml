name: Build WR Draft Mini APK

on:
  push:
    branches:
      - android-wr-draft-mini
    paths:
      - "android-mini/**"
      - ".github/workflows/android-mini-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        run: gradle -p android-mini --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wr-draft-mini-debug-apk
          path: android-mini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
