name: Probe Wild Rift numerical sites
on:
  push:
    branches:
      - v161-numeric-source-collection
    paths:
      - scripts/probe-wr-numeric-sources.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe-wr-numeric-sources.py
