name: Tests Wild Rift V14

on:
  push:
    branches:
      - main
      - v14-development
      - v160-full-official-ability-text
      - v162-wiki-wr-numeric-catalog
      - v163-client-verified-samira-leesin
      - v164-client-shyvana-e
      - v165-mechanistic-draft-synergy
      - v166-productive-survival-pressure
      - v167-grasp-amaranth-draft-audit
      - v168-galio-mid-runes-build-consistency
      - v169-antheal-timed-purchase-decisions
      - v170-contingencies-draft-core-integrity
      - v171-flexible-galio-hybrid-core
      - v172-galio-ap-carry-burst-coherence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier les trois divergences avec les captures client
        run: node --test wrdi-client-verifications-v163.test.js
      - name: Verifier le E de Shyvana avec les captures du client
        run: node --test wrdi-shyvana-client-v164.test.js
      - name: Verifier la puissance AP et le burst quand les allies assurent la frontline
        run: |
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --test wrdi-galio-ap-carry-v172.test.js
      - name: Valider le core hybride Galio flexible et les fins de build anti-menace
        run: |
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --test wrdi-galio-flexible-core-v171.test.js
      - name: Verifier alternatives dynamiques et protection du core Galio
        run: |
          node --check wrdi-galio-contingencies-v1433.js
          node --test wrdi-galio-contingencies-v170.test.js
      - name: Verifier urgences anti-soins et ordre des achats 3-4
        run: |
          node --check wrdi-antiheal-order-v169.js
          node --test wrdi-antiheal-order-v169.test.js
      - name: Verifier la coherence runes et build Galio mid
        run: node --test wrdi-galio-mid-runes-v168.test.js
      - name: Verifier Poigne sur Ahri et Amaranth dans le build
        run: node --test wrdi-grasp-amaranth-v167.test.js
      - name: Verifier la survie productive et les achats situationnels
        run: |
          node --check wrdi-productive-survival-v166.js
          node --test wrdi-productive-survival-v166.test.js
      - name: Calculs des synergies d'objets et scénarios 2,5s / 8s
        run: |
          node --check wrdi-item-interactions-v165.js
          node --test wrdi-item-interactions-v165.test.js
      - name: Valider 625 competences numeriques WR et les patchs
        run: |
          node --check wrdi-numeric-kits-v162.js
          node --test wrdi-numeric-kits-v162.test.js
      - name: Verifier la syntaxe V14
        run: |
          node --check wrdi-core-v14.js
          node --check wrdi-coordinator-v14.js
      - name: Tester le moteur V14.0
        run: node wrdi-core-v14.test.js
      - name: Tester le coordinateur V14.1
        run: node --test wrdi-coordinator-v14.test.js
      - name: Verifier et tester les adaptateurs V14.2
        run: |
          node --check wrdi-adapters-v14.js
          node --test wrdi-adapters-v14.test.js
      - name: Verifier et tester le diagnostic V14.3
        run: |
          node --check wrdi-diagnostic-v14.js
          node --test wrdi-diagnostic-v14.test.js
      - name: Verifier et tester la synthese V14.4
        run: |
          node --check wrdi-threat-summary-v14.js
          node --test wrdi-threat-summary-v14.test.js
      - name: Verifier et tester la preparation Galio V14.5
        run: |
          node --check wrdi-galio-readiness-v14.js
          node --test wrdi-galio-readiness-v14.test.js
      - name: Verifier et tester le duel Galio V14.6
        run: |
          node --check wrdi-galio-item-duel-v14.js
          node --check wrdi-diagnostic-v14.js
          node --test wrdi-galio-item-duel-v14.test.js
      - name: Verifier les captures et prix du catalogue etape A
        run: node --test stage-a-shop-evidence.test.js
      - name: Verifier correspondances historiques et restrictions actifs
        run: node --test stage-a-identity-crosswalk.test.js
      - name: Verifier les captures Combattant et les prix masques
        run: node --test stage-a-fighter-shop.test.js
      - name: Verifier le catalogue Assassin
        run: node --test stage-a-assassin-shop.test.js
      - name: Verifier le catalogue Tireur
        run: node --test stage-a-marksman-shop.test.js
      - name: Verifier le catalogue Support
        run: node --test stage-a-support-shop.test.js
      - name: Verifier l'inventaire sans doublons des six categories
        run: node --test stage-a-cross-category-inventory.test.js
      - name: Tester trois objets actifs client et leurs restrictions
        run: node --test stage-a-standalone-actives-batch2.test.js
      - name: Verify stage A new item details
        run: node --test stage-a-fighter-active-details-batch3.test.js stage-a-marksman-galeforce-detail.test.js
      - name: Tester les details de Redemption
        run: node --test stage-a-redemption-item-details.test.js
      - name: Tester les trois passifs Support du client
        run: node --test stage-a-support-passives-batch4.test.js
      - name: Tester Bâton des flots, Piège à yordles et Vœu du chevalier
        run: node --test stage-a-support-passives-batch5.test.js
      - name: Tester Linceul Manteau et Zeke sur captures client
        run: node --test stage-a-support-defense-batch6.test.js
      - name: Tester Cœur gelé Diadème et Zeke confirmé
        run: node --test stage-a-support-defense-batch7.test.js
      - name: Tester Masque abyssal et non-cumul
        run: node --test stage-a-abyssal-mask-details.test.js
      - name: Tester reconciliation des inventaires et fiches deja verifiees
        run: node --test stage-a-reconciliation-status.test.js
      - name: Tester structure des runes Galio issue du client Wild Rift
        run: node --test stage-a-galio-runes-layout.test.js
      - name: Tester rune fondamentale Electrocution issue du client Wild Rift
        run: node --test stage-a-rune-electrocution.test.js
      - name: Tester les 13 runes fondamentales Wild Rift
        run: node --test stage-a-keystones-batch2.test.js
      - name: Tester dix runes Inspiration Wild Rift
        run: node --test stage-a-inspiration-runes.test.js
      - name: Tester cinq nouvelles runes client Volonte et Inspiration
        run: node --test stage-a-runes-batch3.test.js
      - name: Tester cinq runes Volonte supplementaires depuis le client
        run: node --test stage-a-runes-batch4.test.js
      - name: Tester les dix nouvelles runes du client (lot 5)
        run: node --test stage-a-runes-batch5.test.js
      - name: Tester les cinq runes Domination et les doublons (lot 6)
        run: node --test stage-a-runes-batch6.test.js
      - name: Tester quatre nouvelles runes Domination du client (lot 7)
        run: node --test stage-a-runes-batch7.test.js
      - name: Tester les 39 runes secondaires et leurs arbres
        run: node --test stage-a-minor-rune-completeness.test.js
      - name: Tester les regles de selection des pages de runes V14
        run: node --test wrdi-rune-page-rules-v14.test.js
      - name: Auditer 52 runes et bloquer identifiants ou emplacements inventes
        run: node --test wrdi-rune-catalog-v14.test.js
      - name: Tester catalogue et interface runes V14.7
        run: |
          node --check wrdi-rune-bridge-v14.js
          node --check wrdi-rune-panel-v14.js
          node --test wrdi-rune-bridge-v14.test.js
      - name: Tester les scenarios de runes Galio V14.8
        run: |
          node --check wrdi-galio-rune-scenarios-v14.js
          node --check wrdi-rune-panel-v14.js
          node --test wrdi-galio-rune-scenarios-v14.test.js
      - name: Tester la nouvelle page d acces aux runes V14.9
        run: |
          node --check assets/unified-interface-v149.js
          node --test wrdi-runes-entry-v149.test.js
      - name: Tester la correction runes V14.10 indépendante des objets
        run: |
          node --check wrdi-rune-draft-adapter-v1410.js
          node --check wrdi-rune-panel-v14.js
          node --check wrdi-galio-rune-scenarios-v14.js
          node --test wrdi-rune-draft-adapter-v1410.test.js
      - name: Tester les choix tactiques runes Galio V14.11
        run: |
          node --check wrdi-galio-rune-advisor-v1411.js
          node --check wrdi-rune-panel-v14.js
          node --test wrdi-galio-rune-advisor-v1411.test.js
      - name: Tester analyse des dix kits et runes Galio V14.12
        run: |
          node --check wrdi-ten-kit-runes-v1412.js
          node --check wrdi-ten-kit-panel-v1412.js
          node --test wrdi-ten-kit-runes-v1412.test.js
      - name: Tester matrice Galio et runes documentee V14.13
        run: |
          node --check wrdi-galio-rune-matrix-v1413.js
          node --check wrdi-galio-rune-matrix-panel-v1413.js
          node --test wrdi-galio-rune-matrix-v1413.test.js
      - name: Tester preuves runes Galio V14.14
        run: |
          node --check wrdi-galio-rune-evidence-v1414.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-rune-evidence-v1414.test.js
      - name: Tester le laboratoire de validation Galio V14.15
        run: |
          node --check wrdi-rune-proc-lab-v1415.js
          node --check wrdi-rune-proc-lab-panel-v1415.js
          node --test wrdi-rune-proc-lab-v1415.test.js
      - name: Tester observations Galio confirmees en jeu V14.16
        run: |
          node --check wrdi-galio-player-evidence-v1416.js
          node --test wrdi-galio-player-evidence-v1416.test.js
      - name: Tester integration des observations de runes Galio V14.17
        run: |
          node --check wrdi-galio-rune-evidence-v1414.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-rune-integrated-v1417.test.js
      - name: Tester comparaison de runes selon les menaces V14.18
        run: |
          node --check wrdi-galio-draft-runes-v1418.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-draft-runes-v1418.test.js
      - name: Tester classification des menaces par role et competence V14.19
        run: |
          node --check wrdi-galio-ability-threat-v1419.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-ability-threat-v1419.test.js
      - name: Tester profils officiels adversaires Galio V14.20
        run: |
          node --check wrdi-galio-curated-matchups-v1420.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-curated-matchups-v1420.test.js
      - name: Tester profils jungler/support et cinq runes Galio V14.21
        run: |
          node --check wrdi-galio-five-runes-v1421.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-five-runes-v1421.test.js
      - name: Tester substitutions de runes selon la draft V14.22
        run: |
          node --check wrdi-galio-rune-swaps-v1422.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-galio-rune-swaps-v1422.test.js
      - name: Tester interface epuree de builds et runes V14.23
        run: |
          node --check wrdi-compact-dashboard-v1423.js
          node --check assets/app.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --test wrdi-compact-dashboard-v1423.test.js
      - name: Tester restrictions des objets Galio V14.24
        run: |
          node --check wrdi-galio-item-guard-v1424.js
          node --check assets/app.js
          node --check wrdi-compact-dashboard-v1423.js
          node --test wrdi-galio-item-guard-v1424.test.js
      - name: Tester statut confirme des fiches client V14.25
        run: |
          node --check wrdi-galio-item-guard-v1424.js
          node --test wrdi-galio-item-guard-v1424.test.js
      - name: Tester fin de chargement analyses build runes V14.26
        run: |
          node --check assets/app.js
          node --check wrdi-ten-kit-panel-v1414.js
          node --check wrdi-compact-dashboard-v1423.js
          node --test wrdi-compact-lifecycle-v1426.test.js
      - name: Tester pertinence des passifs client Galio V14.27
        run: |
          node --check wrdi-galio-item-context-v1427.js
          node --check assets/app.js
          node --test wrdi-galio-item-context-v1427.test.js
      - name: Tester comparaison contextuelle des objets Galio V14.28
        run: |
          node --check wrdi-galio-item-comparator-v1428.js
          node --check assets/app.js
          node --test wrdi-galio-item-comparator-v1428.test.js
      - name: Tester les cinq objets Galio sans builds populaires V14.29
        run: |
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check assets/app.js
          node --check wrdi-compact-dashboard-v1423.js
          node --test wrdi-galio-five-item-optimizer-v1429.test.js
      - name: Tester roles, anti-critiques et objets actifs V14.30
        run: |
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check assets/app.js
          node --test wrdi-galio-item-context-v1430.test.js
      - name: Tester profil des menaces et besoins Galio V14.31
        run: |
          node --check wrdi-galio-team-context-v1431.js
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check assets/app.js
          node --test wrdi-galio-team-context-v1431.test.js
      - name: Tester ordre d'achat Galio V14.32
        run: |
          node --check wrdi-galio-purchase-order-v1432.js
          node --check assets/app.js
          node --check wrdi-compact-dashboard-v1423.js
          node --test wrdi-galio-purchase-order-v1432.test.js
      - name: Tester plan pregame et objets situationnels V14.33
        run: |
          node --check wrdi-galio-contingencies-v1433.js
          node --check assets/app.js
          node --check wrdi-compact-dashboard-v1423.js
          node --test wrdi-galio-contingencies-v1433.test.js
      - name: Tester les synergies des passifs du client avec Galio V14.34
        run: |
          node --check wrdi-galio-kit-item-synergy-v1434.js
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --test wrdi-galio-kit-item-synergy-v1434.test.js
      - name: Tester l'entree canonique et les archives V14.34
        run: |
          node --test wrdi-consolidation-smoke.test.js
      - name: Moteur propre V15 sans calculs V12/V13
        run: |
          node --check wrdi-champion-profiles-v15.js
          node --check wrdi-draft-engine-v15.js
          node --check wrdi-app-v15.js
          node --test wrdi-draft-engine-v15.test.js
      - name: Selection mobile des champions V15.1 - noms portraits lanes classes
        run: |
          node --check wrdi-champion-picker-v151.js
          node --check wrdi-app-v15.js
          node --test wrdi-champion-picker-v151.test.js
      - name: Tester l'affichage graphique des objets et runes V15.2
        run: |
          node --check wrdi-rune-images-v152.js
          node --check wrdi-app-v15.js
          node --test wrdi-results-ui-v152.test.js
      - name: Verifier les degats AD AP et la couverture Galio V15.3
        run: |
          node --check wrdi-champion-profiles-v15.js
          node --check wrdi-galio-defense-balance-v153.js
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check wrdi-draft-engine-v15.js
          node --test wrdi-galio-defense-balance-v153.test.js
      - name: Tester l'achat lane puis teamfight V15.4
        run: |
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check wrdi-galio-purchase-order-v1432.js
          node --test wrdi-galio-lane-first-v154.test.js
      - name: Tester la securite du farm Galio melee V15.5
        run: |
          node --check wrdi-galio-team-context-v1431.js
          node --check wrdi-galio-purchase-order-v1432.js
          node --test wrdi-galio-melee-farm-v155.test.js
      - name: Tester role AP Galio et stase conditionnelle V15.6
        run: |
          node --check wrdi-galio-team-context-v1431.js
          node --check wrdi-galio-five-item-optimizer-v1429.js
          node --check wrdi-galio-purchase-order-v1432.js
          node --test wrdi-galio-role-adaptation-v156.test.js
      - name: Tester adaptation des runes Galio aux roles AP V15.7
        run: |
          node --check wrdi-draft-engine-v15.js
          node --test wrdi-galio-rune-role-v157.test.js
      - name: Audit des fiches officielles Wild Rift et de leur couverture
        run: |
          node --check wrdi-champion-kit-reference-v1.js
          node --test wrdi-champion-kit-reference-v1.test.js
      - name: Tester le parseur du site officiel Wild Rift
        run: |
          node --check scripts/collect-official-wr-kits.mjs
          node --test scripts/wr-official-page-parser.test.mjs
      - name: Verifier les 125 champions officiels et leurs 625 competences
        run: |
          node --test wrdi-champion-official-extract-v1.test.js
      - name: Tester le raisonnement des 625 competences officielles Wild Rift
        run: |
          node --check wrdi-official-kit-intelligence-v158.js
          node --check wrdi-draft-engine-v15.js
          node --check wrdi-app-v15.js
          node --test wrdi-official-kit-intelligence-v158.test.js
