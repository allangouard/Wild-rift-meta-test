name: Tests Wild Rift V14

on:
  push:
    branches:
      - v14-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la syntaxe V14
        run: |
          node --check wrdi-core-v14.js
          node --check wrdi-coordinator-v14.js
      - name: Tester le moteur V14.0
        run: node wrdi-core-v14.test.js
      - name: Tester le coordinateur V14.1
        run: node --test wrdi-coordinator-v14.test.js
      - name: Verifier et tester les adaptateurs V14.2
        run: |
          node --check wrdi-adapters-v14.js
          node --test wrdi-adapters-v14.test.js
      - name: Verifier et tester le diagnostic V14.3
        run: |
          node --check wrdi-diagnostic-v14.js
          node --test wrdi-diagnostic-v14.test.js
      - name: Verifier et tester la synthese V14.4
        run: |
          node --check wrdi-threat-summary-v14.js
          node --test wrdi-threat-summary-v14.test.js
      - name: Verifier et tester la preparation Galio V14.5
        run: |
          node --check wrdi-galio-readiness-v14.js
          node --test wrdi-galio-readiness-v14.test.js
      - name: Verifier et tester le duel Galio V14.6
        run: |
          node --check wrdi-galio-item-duel-v14.js
          node --check wrdi-diagnostic-v14.js
          node --test wrdi-galio-item-duel-v14.test.js
      - name: Verifier les captures et prix du catalogue etape A
        run: node --test stage-a-shop-evidence.test.js
      - name: Verifier correspondances historiques et restrictions actifs
        run: node --test stage-a-identity-crosswalk.test.js
      - name: Verifier les captures Combattant et les prix masques
        run: node --test stage-a-fighter-shop.test.js
      - name: Verifier le catalogue Assassin
        run: node --test stage-a-assassin-shop.test.js
      - name: Verifier le catalogue Tireur
        run: node --test stage-a-marksman-shop.test.js
      - name: Verifier le catalogue Support
        run: node --test stage-a-support-shop.test.js
      - name: Verifier l'inventaire sans doublons des six categories
        run: node --test stage-a-cross-category-inventory.test.js
