name: Tests Wild Rift V14

on:
  push:
    branches:
      - v14-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la syntaxe V14
        run: |
          node --check wrdi-core-v14.js
          node --check wrdi-coordinator-v14.js
      - name: Tester le moteur V14.0
        run: node wrdi-core-v14.test.js
      - name: Tester le coordinateur V14.1
        run: node --test wrdi-coordinator-v14.test.js
      - name: Verifier et tester les adaptateurs V14.2
        run: |
          node --check wrdi-adapters-v14.js
          node --test wrdi-adapters-v14.test.js
      - name: Verifier et tester le diagnostic V14.3
        run: |
          node --check wrdi-diagnostic-v14.js
          node --test wrdi-diagnostic-v14.test.js
